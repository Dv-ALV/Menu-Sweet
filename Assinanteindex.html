<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="Assinatura.css">
    <title>Assinante - Menu Sweet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="topo">
        <div class="topo-interno">

            <a href="Cardapioindex.html" class="logo-pequena"><img src="logo1.png" alt="M.S"></a>

            <a href="Cardapioindex.html" class="menu-link link-cardapio">Cardapio</a>
            <a href="#" class="menu-link link-assinatura ativo">Assinatura</a>

            <button type="button" class="btn-modo" aria-label="Alternar modo claro e escuro">
                <img src="sol.png" alt="" class="icone-sol">
                <img src="lua.png" alt="" class="icone-lua">
                <img src="lua.png" alt="" class="mini-lua">
                <img src="sol.png" alt="" class="mini-sol">
            </button>

            <a href="Carrinhoindex.html" class="topo-carrinho" aria-label="Carrinho"><img src="carrinho.png" alt=""></a>
            <a href="Perfilindex.html" class="topo-perfil" aria-label="Perfil"><img src="perfil.png" alt=""></a>

        </div>
    </header>

    <div class="pagina">

        <img src="Assinatura.png" alt="Assinante" class="titulo-imagem">

        <h2 class="titulo-rosa saudacao"><img src="Bomtever.png" alt="Bom te ver"></h2>
        <p class="texto-azul nome">Seu Nome</p>

        <h2 class="titulo-rosa mensalidade"><img src="mensalidade.png" alt="Mensalidade"></h2>
        <p class="texto-azul dia">Em Dia</p>

        <table class="tabela">
            <colgroup>
                <col class="col-dia">
                <col class="col-pedido">
                <col class="col-horario">
            </colgroup>
            <thead>
                <tr>
                    <th>DIA</th>
                    <th>PEDIDO</th>
                    <th>HORARIO</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>

        <h2 class="titulo-rosa endereco-titulo"><img src="endereço.png" alt="Endereço"></h2>
        <ul class="endereco-lista">
            <li>Rua</li>
            <li>Numero</li>
            <li>CEP</li>
            <li>Complemento</li>
        </ul>

        <a href="Perfilindex.html" class="lapis" aria-label="Editar">
            <img src="Edição.png" alt="">
        </a>

    </div>

    <div class="portao">
        <div class="portao-modal">

            <img src="logo3.png" alt="Menu Sweet" class="portao-logo">

            <p class="portao-aviso">NECESSARIO<br>SER</p>

            <img src="Assinatura.png" alt="Assinante" class="portao-titulo">

            <form action="#" method="post" class="portao-form">

                <label for="portao-email" class="portao-rotulo portao-rotulo-email">EMAIL:</label>
                <input type="email" id="portao-email" name="email" class="portao-campo portao-campo-email" autocomplete="email" required>

                <label for="portao-senha" class="portao-rotulo portao-rotulo-senha">SENHA:</label>
                <input type="password" id="portao-senha" name="senha" class="portao-campo portao-campo-senha" autocomplete="current-password" required>

                <button type="submit" class="portao-entrar">ENTRAR</button>

            </form>

            <a href="cadastroassinaturaindex.html" class="portao-cadastrar">CADASTRAR</a>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
