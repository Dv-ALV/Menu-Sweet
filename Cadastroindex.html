<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Cadastro.css">
    <title>Cadastro - Menu Sweet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="pagina" data-vista="cadastro">

        <div class="vistas">

            <div class="vista vista-cadastro">

                <button type="button" class="seta seta-voltar" data-ir="entrar" aria-label="Ir para entrar">←</button>

                <div class="cartao"></div>
                <div class="divisor"></div>

                <form action="#" class="form-cadastro">

                    <label for="telefone" class="rotulo">NUMERO:</label>
                    <input type="tel" id="telefone" name="telefone" class="campo" autocomplete="tel" required>

                    <label for="nome" class="rotulo">NOME:</label>
                    <input type="text" id="nome" name="nome" class="campo" autocomplete="name" required>

                    <label for="email" class="rotulo">EMAIL:</label>
                    <input type="email" id="email" name="email" class="campo" autocomplete="email" required>

                    <label for="senha" class="rotulo">SENHA:</label>
                    <input type="password" id="senha" name="senha" class="campo" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Z]).{8,}" title="Mínimo 8 letras e 1 letra maiúscula" required>

                    <p class="dica dica-1">MINIMO 8 LETRAS</p>
                    <p class="dica dica-2">1 LETRA MAIUSCULA</p>

                    <label for="cep" class="rotulo">CEP:</label>
                    <input type="text" id="cep" name="cep" class="campo" autocomplete="postal-code" required>

                    <label for="num" class="rotulo">NUM:</label>
                    <input type="text" id="num" name="num" class="campo" required>

                    <label for="rua" class="rotulo">RUA:</label>
                    <input type="text" id="rua" name="rua" class="campo" autocomplete="address-line1" required>

                    <label for="apt" class="rotulo">APT:</label>
                    <input type="text" id="apt" name="apt" class="campo">

                    <label for="bairro" class="rotulo">BAIRRO:</label>
                    <input type="text" id="bairro" name="bairro" class="campo" required>

                    <label for="complemento" class="rotulo">Complemento</label>
                    <input type="text" id="complemento" name="complemento" class="campo">

                    <button type="submit" class="btn-cadastrar">CADASTRAR</button>

                </form>

            </div>

            <div class="vista vista-entrar">

                <button type="button" class="seta seta-avancar" data-ir="cadastro" aria-label="Ir para cadastro">→</button>

                <div class="cartao cartao-entrar">

                    <img src="logo3.png" alt="Menu Sweet" class="entrar-logo">

                    <form action="#" class="form-entrar">

                        <label for="entrar-email" class="entrar-rotulo rotulo-email">EMAIL:</label>
                        <input type="email" id="entrar-email" name="email" class="entrar-campo campo-email" autocomplete="email" required>

                        <label for="entrar-senha" class="entrar-rotulo rotulo-senha">SENHA:</label>
                        <input type="password" id="entrar-senha" name="senha" class="entrar-campo campo-senha" autocomplete="current-password" required>

                        <button type="submit" class="btn-entrar">ENTRAR</button>

                    </form>

                </div>

            </div>

        </div>

        <header class="topo">
            <a href="Cardapioindex.html" class="logo-pequena"><img src="logo1.png" alt="M.S"></a>

            <a href="#entrar" class="topo-link link-entrar" data-ir="entrar">ENTRAR</a>
            <a href="#cadastro" class="topo-link link-cadastro ativo" data-ir="cadastro">CADASTRO</a>
        </header>

    </div>

    <script src="script.js"></script>
</body>
</html>
