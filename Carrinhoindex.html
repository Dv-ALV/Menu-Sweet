<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Carrinho.css">
    <title>Carrinho - Menu Sweet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="pagina">

        <header class="topo">
            <a href="Cardapioindex.html" class="logo-pequena"><img src="logo1.png" alt="M.S"></a>
        </header>

        <section class="bloco-carrinho">
            <div class="painel-carrinho"></div>
            <img src="Carrinho.png" alt="Carrinho" class="img-carrinho">
        </section>

        <section class="bloco-pedido">
            <div class="painel-pedido"></div>
            <div class="pedido-divisor"></div>

            <p class="pedido-texto pedido-titulo">PEDIDO:</p>
            <div class="pedido-lista"></div>

            <p class="pedido-endereco">(ENDEREÇO)</p>
            <p class="pedido-texto pedido-frete">FRETE:</p>
            <p class="pedido-texto pedido-total">TOTAL:</p>

            <button type="button" class="btn-comprar">COMPRAR</button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
